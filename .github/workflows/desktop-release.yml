name: Desktop & TUI Release

# 同一 GitHub Release 同时发布：
#   - 桌面安装包（Tauri）
#   - 终端 TUI 自包含发行包（随包 Node + 后端）
# Tag 约定：desktop-app-v0.0.1-beta / desktop-app-v0.0.2 / desktop-app-v1.0.0
# 平台：macOS Apple Silicon、Windows x64、Ubuntu x64（不再支持 macOS Intel）。
#
# 触发：
#   git tag desktop-app-v0.0.1-beta && git push origin desktop-app-v0.0.1-beta
#   或 Actions → Desktop & TUI Release → Run workflow

on:
  push:
    tags:
      - 'desktop-app-v*'
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，如 0.0.4-beta（不要带 desktop-app-v 前缀；桌面端与 TUI 共用）"
        required: true
        type: string
      prerelease:
        description: "标记为 pre-release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本与 tag
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            case "$TAG" in
              desktop-app-v*) V="${TAG#desktop-app-v}" ;;
              *) echo "::error::tag 必须以 desktop-app-v 开头"; exit 1 ;;
            esac
            if echo "$V" | grep -q '-'; then PRE="true"; else PRE="false"; fi
          else
            V="${{ github.event.inputs.version }}"
            V="${V#desktop-app-v}"; V="${V#v}"
            TAG="desktop-app-v${V}"
            if [ "${{ github.event.inputs.prerelease }}" = "true" ] || echo "$V" | grep -q '-'; then
              PRE="true"
            else
              PRE="false"
            fi
          fi
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::非法版本号: $V"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "desktop release → version=$V tag=$TAG prerelease=$PRE"

      - name: 创建 GitHub Release（若不存在）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，复用。"
          else
            FLAGS=""
            if [ "${{ steps.ver.outputs.prerelease }}" = "true" ]; then FLAGS="--prerelease"; fi
            gh release create "$TAG" $FLAGS \
              --title "Secbot Desktop & TUI ${{ steps.ver.outputs.version }}" \
              --notes "桌面端安装包与终端 TUI 发行包。平台：macOS Apple Silicon、Windows x64、Ubuntu x64（不含 macOS Intel）。Tag: \`${TAG}\`。"
          fi

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: 安装依赖
        run: |
          npm ci
          npm run install:web
          npm --prefix desktop ci

      - name: 注入桌面版本号
        run: node scripts/set-desktop-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: 构建桌面安装包
        env:
          SECBOT_TARGET_TRIPLE: ${{ matrix.target }}
          VITE_SECBOT_DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm --prefix desktop run build:ci

      - name: 上传安装包到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          BUNDLE="desktop/src-tauri/target/release/bundle"
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find "$BUNDLE" -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.msi" -o -name "*.exe" \
               -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) 2>/dev/null)
          # 部分平台只有 .app 目录：打成 zip 再传
          if [ ${#files[@]} -eq 0 ]; then
            while IFS= read -r app; do
              zipname="${app%.app}.zip"
              ditto -c -k --sequesterRsrc --keepParent "$app" "$zipname" 2>/dev/null \
                || (cd "$(dirname "$app")" && zip -r "$(basename "$zipname")" "$(basename "$app")")
              files+=("$zipname")
            done < <(find "$BUNDLE" -type d -name "*.app" 2>/dev/null)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::未找到桌面安装包产物于 $BUNDLE"
            find "$BUNDLE" -maxdepth 3 2>/dev/null || true
            exit 1
          fi
          # 文件名带上版本与平台，便于下载识别
          outdir="dist-upload"
          mkdir -p "$outdir"
          upload=()
          for f in "${files[@]}"; do
            base="$(basename "$f")"
            dest="$outdir/secbot-desktop-${{ needs.prepare.outputs.version }}-${{ matrix.label }}-${base}"
            cp "$f" "$dest"
            upload+=("$dest")
          done
          printf '将上传：%s\n' "${upload[@]}"
          gh release upload "$TAG" "${upload[@]}" --clobber

      - name: 存档构建产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}-${{ needs.prepare.outputs.version }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.rpm
            dist-upload/**
          if-no-files-found: warn

  tui:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-22.04
            label: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装依赖
        run: |
          npm ci
          npm run install:web

      - name: 构建 server / TUI / web
        run: npm run build && npm run build:terminal-ui && npm run build:web

      - name: 打包自包含 TUI 发行包
        id: pack
        run: node scripts/pack-tui-dist.mjs "${{ needs.prepare.outputs.version }}" "${{ matrix.label }}"

      - name: 上传 TUI 发行包到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          ARTIFACT="${{ steps.pack.outputs.artifact }}"
          shopt -s nullglob
          if [ -z "${ARTIFACT:-}" ] || [ ! -f "$ARTIFACT" ]; then
            matches=(dist/tui/secbot-tui-*.tar.gz dist/tui/secbot-tui-*.zip)
            ARTIFACT="${matches[0]:-}"
          fi
          if [ -z "${ARTIFACT:-}" ] || [ ! -f "$ARTIFACT" ]; then
            echo "::error::未找到 TUI 发行包: ${{ steps.pack.outputs.artifact }}"
            ls -la dist/tui || true
            exit 1
          fi
          echo "将上传：$ARTIFACT"
          gh release upload "$TAG" "$ARTIFACT" --clobber

      - name: 存档 TUI 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.label }}-${{ needs.prepare.outputs.version }}
          path: dist/tui/secbot-tui-*
          if-no-files-found: error
