[package]
name = "secbot-desktop"
version = "0.0.2-beta"
description = "Secbot 桌面端（Tauri v2）"
authors = ["Secbot"]
edition = "2021"
rust-version = "1.77.2"

# main.rs 为唯一入口
[[bin]]
name = "secbot-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
