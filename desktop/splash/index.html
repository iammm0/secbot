<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secbot</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        background: #050807;
        overflow: hidden;
      }
      body {
        background-image:
          linear-gradient(rgba(0, 255, 136, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 136, 0.035) 1px, transparent 1px);
        background-size: 44px 44px;
      }
      .wrap {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        user-select: none;
        position: relative;
      }
      .wrap::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(0, 255, 136, 0.09), transparent 55%);
        pointer-events: none;
      }
      .welcome {
        position: relative;
        font-family: "Courier New", "Lucida Console", "Menlo", monospace;
        font-weight: 700;
        font-size: clamp(1.35rem, 4.2vw, 2.35rem);
        letter-spacing: 0.22em;
        color: #00ff88;
        text-shadow:
          0 0 6px rgba(0, 255, 136, 0.7),
          0 0 18px rgba(0, 255, 136, 0.4),
          0 0 42px rgba(0, 255, 136, 0.2),
          2px 0 0 rgba(0, 255, 200, 0.25),
          -2px 0 0 rgba(0, 180, 100, 0.2);
        animation: flicker 3.2s infinite;
      }
      .scan {
        position: absolute;
        left: -10%;
        right: -10%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.75), transparent);
        animation: scan 2.4s linear infinite;
        pointer-events: none;
      }
      @keyframes scan {
        0% { top: 8%; opacity: 0; }
        12% { opacity: 1; }
        88% { opacity: 1; }
        100% { top: 92%; opacity: 0; }
      }
      @keyframes flicker {
        0%, 19%, 21%, 23%, 80%, 100% { opacity: 1; filter: none; }
        20%, 22% { opacity: 0.7; filter: brightness(1.25); }
      }
      .hint {
        position: relative;
        font-family: "Courier New", "Lucida Console", "Menlo", monospace;
        font-size: 11px;
        letter-spacing: 0.32em;
        color: rgba(0, 255, 136, 0.42);
        text-transform: uppercase;
      }
      .err {
        position: relative;
        font-size: 13px;
        color: #f87171;
        max-width: 420px;
        text-align: center;
        line-height: 1.6;
        display: none;
        font-family: "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="welcome" aria-live="polite">
        <div class="scan" aria-hidden="true"></div>
        欢迎使用 SECBOT
      </div>
      <div class="hint" id="hint">SYSTEM BOOT · LOCAL SERVICE</div>
      <div class="err" id="err"></div>
    </div>
    <script>
      setTimeout(() => {
        const h = document.getElementById("hint");
        const e = document.getElementById("err");
        if (h) h.style.display = "none";
        if (e) {
          e.style.display = "block";
          e.textContent =
            "本地服务启动超时。请确认已执行桌面端开发启动，或查看终端日志。";
        }
      }, 60000);
    </script>
  </body>
</html>
